name: Validate Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Normalize metadata, checksums, release dates, and index
        env:
          SET_RELEASE_DATES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import socket
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          set_release_dates = os.environ.get('SET_RELEASE_DATES', '').lower() == 'true'
          changed = False
          extension_ids = []
          download_errors = []

          def write_json(path, data):
              path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          def compute_sha256(ext_id, version_id, url):
              try:
                  with urllib.request.urlopen(url, timeout=120) as response:
                      payload = response.read()
              except urllib.error.HTTPError as exc:
                  reason = f'HTTP {exc.code} {exc.reason}'
                  asset = url.rsplit('/', 1)[-1]
                  download_errors.append(
                      f'{ext_id}: version {version_id} downloadUrl returned {reason}: {url}. '
                      f'Expected release asset {asset!r} to exist at that URL. Publish the release asset first, or correct downloadUrl.'
                  )
                  return None
              except urllib.error.URLError as exc:
                  download_errors.append(
                      f'{ext_id}: version {version_id} downloadUrl could not be reached: {url}. Reason: {exc.reason}'
                  )
                  return None
              except (TimeoutError, socket.timeout) as exc:
                  download_errors.append(
                      f'{ext_id}: version {version_id} downloadUrl timed out after 120 seconds: {url}. Reason: {exc}'
                  )
                  return None
              except OSError as exc:
                  download_errors.append(
                      f'{ext_id}: version {version_id} downloadUrl failed: {url}. Reason: {exc}'
                  )
                  return None
              return hashlib.sha256(payload).hexdigest().lower()

          for meta_path in sorted(pathlib.Path('extensions').glob('*.json')):
              ext_id = meta_path.stem
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              original = json.dumps(meta, sort_keys=True)
              extension_ids.append(ext_id)

              if meta.get('id') != ext_id:
                  meta['id'] = ext_id

              source_manifest = None
              source_manifest_url = meta.get('sourceManifestUrl')
              if source_manifest_url:
                  try:
                      with urllib.request.urlopen(source_manifest_url, timeout=60) as response:
                          source_manifest = json.loads(response.read().decode('utf-8'))

                      # Keep registry entries thin: sync display metadata only. Dependencies are NOT synced
                      # to the top level — they are captured per release into versions[].dependencies below,
                      # so older releases keep the dependency requirements they shipped with instead of
                      # inheriting the latest version's (which can require a newer, host-incompatible dep).
                      sync_fields = ['name', 'description', 'author', 'iconUrl', 'kind', 'categories']
                      for field in sync_fields:
                          if source_manifest.get(field) is not None and meta.get(field) != source_manifest.get(field):
                              meta[field] = source_manifest[field]
                  except Exception:
                      source_manifest = None

              # Dependencies live per version now; drop any legacy extension-level block so it can't be
              # used as a fallback that forces older releases to require the latest version's deps.
              if 'dependencies' in meta:
                  del meta['dependencies']

              source_version = source_manifest.get('version') if source_manifest else None
              source_dependencies = (source_manifest.get('dependencies') if source_manifest else None) or {}

              for version in meta.get('versions', []):
                  download_url = version.get('downloadUrl')
                  if download_url:
                      version_id = version.get('version') or '?'
                      actual = compute_sha256(ext_id, version_id, download_url)
                      if actual:
                          expected = f'sha256:{actual}'
                          if version.get('checksum') != expected:
                              version['checksum'] = expected

                  if set_release_dates and not version.get('releasedAt'):
                      version['releasedAt'] = now

                  # Auto-fill a newly added release's dependencies from the source manifest that currently
                  # describes it. Only fills when absent so hand-authored per-version deps are never
                  # clobbered, and other (older) versions are left untouched.
                  if source_version and 'dependencies' not in version and version.get('version') == source_version:
                      version['dependencies'] = source_dependencies

              if json.dumps(meta, sort_keys=True) != original:
                  write_json(meta_path, meta)
                  changed = True

          index_path = pathlib.Path('index.json')
          generated = {
              'schemaVersion': '2.0',
              'extensions': [{'id': ext_id} for ext_id in sorted(set(extension_ids))]
          }
          existing = json.loads(index_path.read_text(encoding='utf-8')) if index_path.exists() else {}
          if existing != generated:
              write_json(index_path, generated)
              changed = True

          if download_errors:
              print('Registry normalization failed while computing checksum(s).', file=sys.stderr)
              for error in download_errors:
                  print(f'ERROR: {error}', file=sys.stderr)
              sys.exit(1)

          print(f'Registry normalization complete at {now}; changed={changed}')
          PY

      - name: Commit generated registry changes
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync registry metadata"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push
          fi

      - name: Validate schema and generated fields
        env:
          REQUIRE_RELEASED_AT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          require_released_at = os.environ.get('REQUIRE_RELEASED_AT', '').lower() == 'true'
          index_path = pathlib.Path('index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))

          errors = []
          if not index.get('schemaVersion'):
              errors.append('Missing schemaVersion')
          if not isinstance(index.get('extensions'), list):
              errors.append('Missing extensions array')

          ids = []
          for entry in index.get('extensions', []):
              if set(entry.keys()) != {'id'}:
                  errors.append(f'index entry must contain only id: {entry}')
                  continue
              ids.append(entry['id'])
          if len(ids) != len(set(ids)):
              errors.append('Duplicate extension IDs in index.json')

          legacy_paths = sorted(pathlib.Path('extensions').glob('*/metadata.json'))
          for legacy_path in legacy_paths:
              errors.append(f'{legacy_path}: old extensions/<id>/metadata.json layout is not allowed; use extensions/<id>.json')

          forbidden_top_level = {'url', 'minCoveVersion', 'version', 'releasedAt', 'checksum', 'downloadUrl', 'updatedAt'}
          meta_ids = []
          for meta_path in sorted(pathlib.Path('extensions').glob('*.json')):
              ext_id = meta_path.stem
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              meta_ids.append(ext_id)

              if meta.get('id') != ext_id:
                  errors.append(f'{ext_id}: metadata id mismatch')

              extra_generated_fields = sorted(forbidden_top_level.intersection(meta.keys()))
              if extra_generated_fields:
                  errors.append(f'{ext_id}: top-level fields must move to versions[] or source manifest: {extra_generated_fields}')

              has_summary = all(meta.get(k) for k in ['name', 'description', 'author'])
              if not has_summary and not meta.get('sourceManifestUrl'):
                  errors.append(f'{ext_id}: provide summary fields or sourceManifestUrl')

              source_manifest_url = meta.get('sourceManifestUrl') or ''
              if 'github.com/' in source_manifest_url and '/blob/' in source_manifest_url:
                  errors.append(f'{ext_id}: sourceManifestUrl must use raw.githubusercontent.com, not a github.com blob URL')

              if not meta.get('repositoryUrl'):
                  errors.append(f'{ext_id}: repositoryUrl is required')

              for category in meta.get('categories', []):
                  if category != category.lower() or ' ' in category:
                      errors.append(f'{ext_id}: category must be lowercase kebab-case: {category}')

              versions = meta.get('versions')
              has_versions = isinstance(versions, list) and len(versions) > 0
              is_source_scraper_pack = (
                  meta.get('kind') == 'scraper-pack'
                  and bool(meta.get('sourceManifestUrl'))
                  and not has_versions
              )

              if versions is not None and not isinstance(versions, list):
                  errors.append(f'{ext_id}: versions must be an array when provided')
                  continue

              if not has_versions:
                  if is_source_scraper_pack:
                      continue
                  errors.append(f'{ext_id}: metadata has no versions')
                  continue

              for version in versions:
                  version_id = version.get('version') or '?'
                  if not version.get('version'):
                      errors.append(f'{ext_id}: version entry missing version string')
                  if not version.get('downloadUrl'):
                      errors.append(f'{ext_id}: version {version_id} missing downloadUrl')
                  if not version.get('minCoveVersion'):
                      errors.append(f'{ext_id}: version {version_id} missing minCoveVersion')
                  if require_released_at and not version.get('releasedAt'):
                      errors.append(f'{ext_id}: version {version_id} missing generated releasedAt')

                  checksum = (version.get('checksum') or '').strip()
                  if not checksum:
                      errors.append(f'{ext_id}: version {version_id} missing generated checksum')
                      continue
                  if not checksum.lower().startswith('sha256:'):
                      errors.append(f'{ext_id}: version {version_id} checksum must use sha256:<64-hex> format')
                      continue
                  normalized = checksum[7:]
                  if not re.fullmatch(r'[A-Fa-f0-9]{64}', normalized):
                      errors.append(f'{ext_id}: version {version_id} has invalid checksum format')

          if set(ids) != set(meta_ids):
              errors.append(f'index IDs and metadata IDs mismatch (index={sorted(set(ids))}, metadata={sorted(set(meta_ids))})')

          if errors:
              for error in errors:
                  print(f'ERROR: {error}', file=sys.stderr)
              sys.exit(1)

          print(f'Validated {len(meta_ids)} flat registry entries')
          PY

      - name: Ensure generated changes are committed for fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --exit-code
